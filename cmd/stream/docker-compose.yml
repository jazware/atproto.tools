version: "3.8"
services:
  looking-glass-consumer:
    image: ghcr.io/jazware/atproto.tools/looking-glass-consumer:${VERSION}
    build:
      context: ../../
      dockerfile: cmd/stream/Dockerfile
    restart: always
    container_name: looking-glass-consumer
    ports:
      - "6962:8080"
    volumes:
      - ../../data/lg-consumer:/data
    env_file:
      - .lg.env
    environment:
      - LG_WS_URL=wss://bsky.network/xrpc/com.atproto.sync.subscribeRepos
      - LG_PORT=8080
      - LG_DEBUG=false
      - LG_DUCKDB_PATH=/data/looking-glass.db
      - LG_MIGRATE_DB=true
      - LG_EVT_RECORD_TTL=12h
      - LG_PARQUET_DIR=/data/parquet
